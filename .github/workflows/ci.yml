name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: License validator portability regressions
        run: python -m unittest discover -s scripts/licenses -p 'test_*.py' -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Linux credential-service build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Single-executable license export and portable verifier regressions
        run: python -m unittest discover -s scripts/release -p 'test_portable_notices.py' -v
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Frontend unit tests
        run: pnpm test
      - name: Rust core and database tests
        run: python scripts/ci/rust_tests.py -- cargo test --locked
