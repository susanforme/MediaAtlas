[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/desktop-bridge", "crates/media-scanner", "apps/desktop/src-tauri"]
default-members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/desktop-bridge", "crates/media-scanner"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.9"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
mediaatlas-domain = { path = "crates/domain" }
mediaatlas-application = { path = "crates/application" }
mediaatlas-infrastructure = { path = "crates/infrastructure" }
mediaatlas-desktop-bridge = { path = "crates/desktop-bridge" }
mediaatlas-media-scanner = { path = "crates/media-scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tempfile = "3"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "http2"] }
scraper = "0.24"
tokio-util = "0.7"
httpdate = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
