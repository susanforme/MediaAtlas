[package]
name = "mediaatlas-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
mediaatlas-domain.workspace = true
mediaatlas-application.workspace = true
mediaatlas-media-scanner.workspace = true
globset.workspace = true
lofty = "0.22"
image.workspace = true
base64.workspace = true
sqlx.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
scraper.workspace = true
tokio-util.workspace = true
httpdate.workspace = true
sha2 = "0.10"
roxmltree = "0.20"
cap-std = "3"
cap-fs-ext = "3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
open = "5.4.5"
notify = "8"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
tempfile.workspace = true

[lints]
workspace = true
